[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex-transport-ops"
version = "0.1.0"
description = "Synthetic student transport routing and daily operations demo"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0", "streamlit>=1.35", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transport-ops = "transport_ops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
